- name: "What Drives Bitcoin Fees? Using SegWit to Assess Bitcoin’s Long-Run Sustainability"
  date: 2021-01-21
  description: |
    Can Bitcoin remain tamper-proof in the long run?
    We use block-level data from the Bitcoin blockchain to estimate the impact of congestion and the US dollar price on fee rates.
  link: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4013550"
- name: "2025 Survey of CPI Production Systems"
  date: 2025-04-30
  description: "Delivered a <a href='https://un-task-team-for-scanner-data.github.io/production-systems-survey/pdf/Survey-of-CPI-Production-Systems.pdf'>report</a> and <a href='https://un-task-team-for-scanner-data.github.io/production-systems-survey/presentation/presentation.html#/title-slide'>presentation</a> summarizing the results of a Survey of National Statistics Offices (NSOs) for 70 countries on CPI system modernization on behalf of the United Nations Economic Commission for Europe's (UNECE) <a href='https://unstats.un.org/bigdata/'>Committee of Experts on Big Data and Data Science for Official Statistics</a>. This work was presented at the UNECE's <a href='https://unece.org/info/Statistics/events/394156'>2025 Meeting of the Group of Experts on Consumer Price Indices</a>."
  link: "https://un-task-team-for-scanner-data.github.io/production-systems-survey/report-site/intro.html"
